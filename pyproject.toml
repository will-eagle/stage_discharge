[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stage_discharge"
version = "0.1.0"
description = "Stage–discharge rating tools for HOBO and VuSitu sensor logs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "matplotlib"
    # add the rest of what read_write / build_stage actually import
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]